[package]
name = "focus-desktop"
version = "1.12.8"
description = "Focus Desktop spike: local focus desktop & agent pet (Tauri 2 + Vue 3)"
authors = ["Focus Desktop Contributors"]
edition = "2021"
default-run = "desktop"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "desktop"
path = "src/main.rs"

[[bin]]
name = "workerw_probe"
path = "src/bin/workerw_probe.rs"

[[bin]]
name = "focus-cli"
path = "src/bin/focus-cli.rs"

[features]
# This feature is required for production builds: without it tauri-build
# emits `dev` (devUrl) even for release, so the binary does not embed dist.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
rusqlite = { version = "0.40", features = ["bundled"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_System_SystemInformation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_LibraryLoader"
] }
chrono = { version = "0.4", features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
lofty = "0.24"
base64 = "0.22"
